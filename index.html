<style>
:root{--panel:rgba(15,22,36,.92);--line:rgba(148,163,184,.16);--tx:#e2e8f0;--tx2:#94a3b8;
 --acc:#38bdf8;--acc2:#818cf8;--tr:all .22s cubic-bezier(.4,0,.2,1);--lfs:9px;--lvis:visible}
*{box-sizing:border-box}
html,body,#map{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:#0b1120}
#lg{position:absolute;top:10px;left:10px;z-index:1000;background:var(--panel);backdrop-filter:blur(16px);
 border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:305px}
#lg h1{margin:0 0 2px;font-size:13px;font-weight:800;letter-spacing:-.02em;
 background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#lg p{margin:0 0 8px;font-size:9px;color:var(--tx2)}
.per{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:9px;cursor:pointer;transition:var(--tr);font-size:10.5px;color:var(--tx)}
.per:hover{background:rgba(56,189,248,.09)}
.per.off{opacity:.32}
.per .chip{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.per .nm{flex:1;font-weight:700;line-height:1.2}
.per .ct{font-size:8.5px;color:var(--tx2);text-align:right;line-height:1.25}
#ortak{margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);font-size:8.5px;color:var(--tx2);line-height:1.5}
.stripe{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;
 background:repeating-linear-gradient(45deg,#f59e0b 0 3px,#10b981 3px 6px)}
.stripe2{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;
 background:repeating-linear-gradient(45deg,#f59e0b 0 3px,#ec4899 3px 6px)}
.blab4{color:#eaf7ff;font-weight:800;font-size:var(--lfs);font-family:'Inter';white-space:nowrap;letter-spacing:.02em;
 visibility:var(--lvis);
 text-shadow:-1px -1px 0 #04101f,1px -1px 0 #04101f,-1px 1px 0 #04101f,1px 1px 0 #04101f,0 0 7px rgba(2,10,20,.9)}
.blab4.big{visibility:visible}
.leaflet-popup-content-wrapper{background:#111a2c;color:var(--tx);border-radius:11px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:#111a2c}
.leaflet-popup-content{font:500 11px 'Inter';margin:10px 12px}
.pp b{font-weight:800}
.pp .own{display:inline-block;margin:4px 4px 0 0;padding:2px 8px;border-radius:999px;font-size:9.5px;font-weight:800;color:#0b1120}
.pp table{margin-top:6px;font-size:10px;border-collapse:collapse}
.pp td{padding:1px 8px 1px 0;color:var(--tx2)}
.pp td b{color:var(--tx)}
.mctl{display:flex;background:var(--panel)!important;backdrop-filter:blur(14px);border:1px solid var(--line)!important;
 border-radius:999px!important;padding:3px;gap:3px;box-shadow:0 6px 24px rgba(0,0,0,.4)!important}
.mctl button{border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--tx2);
 font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.mctl button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f}
.leaflet-control-scale-line{background:rgba(15,22,36,.8);color:#e2e8f0;border-color:rgba(226,232,240,.5);font:600 9px 'Inter'}
@media(max-width:640px){#lg{max-width:250px}}

/* —— SOL PANEL: kişi + günün nöbetçileri —— */
#lg{color:var(--tx);top:10px;bottom:10px;width:min(330px,calc(100vw - 20px));max-width:none;display:flex;flex-direction:column}
#lgh{display:flex;align-items:flex-start;gap:8px}#lgh>div{flex:1}
#lgx{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:none;color:var(--tx2);cursor:pointer;font-size:11px}
#lgb{display:flex;flex-direction:column;flex:1;min-height:0}
#lg.min{bottom:auto}#lg.min #lgb{display:none}
.nb-info{margin:0 0 7px;padding:6px 9px;border-radius:9px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.38);color:#fecaca;font-size:9.5px;line-height:1.4}
.nb-info b{color:#fff}.nb-info.old{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:#fde68a}
#q{width:100%;margin-bottom:6px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:#111a2c;color:var(--tx);font:500 11px 'Inter';outline:none}
#q:focus{border-color:var(--acc)}
#pl{flex:1;min-height:0;overflow-y:auto;padding-right:2px}
#pl::-webkit-scrollbar{width:6px}#pl::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
.per .ct{white-space:nowrap}
.nbc{flex:none;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font:800 9.5px/19px 'Inter';text-align:center}
.nbc.z{background:#334155;color:#94a3b8}
.eye{flex:none;border:none;background:none;color:var(--tx2);cursor:pointer;font-size:12px;padding:0 2px}
.pb{margin:1px 4px 7px 22px;padding:2px 0 2px 8px;border-left:2px solid var(--line);font-size:10.5px}
.bt{margin-top:6px;font-size:9px;font-weight:800;letter-spacing:.05em;color:var(--teal,#2dd4bf);cursor:pointer;text-transform:uppercase}
.bt i{font-style:normal;color:#f59e0b;text-transform:none;letter-spacing:0;font-weight:700}
.nbitem{padding:4px 5px;margin:2px 0;border-radius:7px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);cursor:pointer;line-height:1.35}
.nbitem:hover{background:rgba(239,68,68,.2)}
.nbitem b{display:block;font-size:11px;color:var(--tx)}.nbitem small{display:block;color:var(--tx2);font-size:9.5px}
.nbitem a{color:var(--acc);text-decoration:none;font-weight:700}
.none{color:var(--tx2);font-size:10px;padding:2px 0}
.eicon4{width:14px;height:14px;border-radius:50%;background:#fbbf24;color:#2a1a00;border:1.5px solid #fff;font:800 8.5px/11px 'Inter';text-align:center;
 box-shadow:0 1px 5px rgba(0,0,0,.7);transform:scale(var(--es,1));transition:transform .2s;animation:nbp 1.7s infinite;cursor:pointer}
@keyframes nbp{0%{box-shadow:0 0 0 0 rgba(251,191,36,.75),0 1px 5px rgba(0,0,0,.7)}70%{box-shadow:0 0 0 10px rgba(251,191,36,0),0 1px 5px rgba(0,0,0,.7)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0),0 1px 5px rgba(0,0,0,.7)}}

/* —— MOBİL: panel alttan açılan çekmece —— */
@supports(height:100dvh){html,body,#map{height:100dvh}}
.leaflet-popup-content{max-height:50vh;overflow-y:auto}
@media(max-width:700px){
 #lg{left:0;right:0;top:auto;bottom:0;width:auto;height:46vh;max-width:none;border-radius:16px 16px 0 0;border-width:1px 0 0;
  padding:6px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.5)}
 @supports(height:100dvh){#lg{height:46dvh}}
 #lg.min,#lg.min:not(.x){top:auto;bottom:0;height:auto}
 #lg::before{content:'';display:block;width:38px;height:4px;border-radius:4px;background:rgba(148,163,184,.45);margin:0 auto 6px}
 #lgh{cursor:pointer}
 #lgx{width:34px;height:34px;font-size:14px}
 #lg h1{font-size:12px}
 #lg p{font-size:9.5px}
 #q{font-size:16px;padding:9px 10px}
 .per{padding:9px 6px}
 .per .nm{font-size:11.5px}
 .eye{font-size:17px;padding:6px 4px}
 .nbitem{padding:9px 8px}
 .nbitem b{font-size:12px}.nbitem small{font-size:10.5px}
 .nbitem a{display:inline-block;padding:4px 0}
 .bt{padding:6px 0;font-size:10px}
 #ortak{display:none}
 .mctl button{padding:8px 10px}
 .leaflet-control-zoom,.leaflet-control-scale{display:none}
 .leaflet-popup-content{max-width:72vw}
}

function nbHtml(b){const n=nbList(b);
 if(!n.length)return '<div style="margin-top:7px;color:#94a3b8">Bugün nöbetçi eczane yok.</div>';
 return `<div style="margin-top:8px;padding-top:6px;border-top:1px dashed rgba(148,163,184,.3)"><b style="color:#fca5a5">🔴 Bugün nöbetçi (${n.length})</b>`+
  n.map(x=>`<div style="margin-top:4px"><b>${esc(cln(x.name))}</b>${x.phone?` <a href="tel:${esc(tel(x.phone))}" style="color:#38bdf8">${esc(nbPhone(x.phone))}</a>`:''}<br/><span style="color:#94a3b8;font-size:9.5px">${esc(cln(x.address))}</span>${x.note?`<br/><span style="color:#fbbf24;font-size:9.5px">ℹ️ ${esc(cln(x.note))}</span>`:''}${mapUrl(x)?`<br/><a href="${esc(mapUrl(x))}" target="_blank" rel="noopener" style="color:#38bdf8;font-size:10px">📍 Yol tarifi</a>`:''}</div>`).join('')+'</div>';}

const OWNED={}; for(const b in OWN)OWN[b].forEach(p=>(OWNED[p]=OWNED[p]||[]).push(b));
const BL={}; LAYERS.forEach(l=>{const b=l.feature.properties.full;(BL[b]=BL[b]||[]).push(l)});
const ll=b=>L.latLng(CENT[b][1],CENT[b][0]);
function openB(b){if(isM())setMin(true);if(BL[b]&&CENT[b])BL[b][0].openPopup(ll(b));}
function focusBrick(b){const ls=BL[b];if(!ls)return;if(isM())setMin(true);
 let bd=null;ls.forEach(l=>{const x=l.getBounds();bd=bd?bd.extend(x):L.latLngBounds(x.getSouthWest(),x.getNorthEast())});
 map.flyToBounds(bd.pad(.25),{duration:.8,paddingBottomRight:isM()?[0,70]:[0,0]});setTimeout(()=>openB(b),900);}

// haritada nöbetçi rozetleri
const nbG=L.layerGroup().addTo(map), badges={};
for(const b in NB.bricks){if(!CENT[b]||!nbList(b).length)continue;
 const m=L.marker([CENT[b][1]-0.0028,CENT[b][0]],{icon:L.divIcon({className:'eicon4',html:String(nbList(b).length),iconSize:[14,14]})});
 m.on('click',()=>openB(b));badges[b]=m;nbG.addLayer(m);}
function updBadges(){for(const b in badges){const vis=(OWN[b]||[]).some(o=>!hidden.has(o));
 if(vis)nbG.addLayer(badges[b]);else nbG.removeLayer(badges[b]);}}

// üst bilgi: tarih + toplam (ortak brickteki eczane bir kez sayılır)
(function(){const el=document.getElementById('nb-info');
 const tot=Object.values(NB.bricks).reduce((a,v)=>a+v.length,0), nbr=Object.keys(NB.bricks).filter(b=>nbList(b).length).length;
 if(!tot)return;
 const NOBET_SAATI=9; // nöbet günü TR saatiyle bu saatte değişir; ondan önce hâlâ dünün listesi geçerli
 const today=new Date(Date.now()-NOBET_SAATI*3600e3).toLocaleDateString('sv-SE',{timeZone:'Europe/Istanbul'}), d=NB.date.split('-').reverse().join('.');
 el.style.display='block';
 if(NB.date>=today)el.innerHTML=`🔴 <b>${d}</b> nöbetçi eczaneler: <b>${tot}</b> eczane • <b>${nbr}</b> brick`;
 else{el.classList.add('old');el.innerHTML=`⚠️ Nöbetçi verisi <b>${d}</b> tarihli (bugünün listesi henüz yüklenmedi) • <b>${tot}</b> eczane`;}})();

// kişi kartları
const pl=document.getElementById('pl'), openP=new Set(); let Q='';
function render(){pl.innerHTML='';const q=sn(Q.trim());
 for(const p in PERS){
  const bricks=(OWNED[p]||[]).slice().sort(), duty=bricks.filter(b=>nbList(b).length);
  const rows=duty.map(b=>({b,l:nbList(b).filter(x=>!q||sn(x.name).includes(q)||sn(short(b)).includes(q))})).filter(o=>o.l.length);
  if(q&&!rows.length)continue;
  const cnt=duty.reduce((a,b)=>a+nbList(b).length,0);
  const hd=document.createElement('div');hd.className='per'+(hidden.has(p)?' off':'');
  hd.innerHTML=`<span class="chip" style="background:${PERS[p].c}"></span><span class="nm">${p}</span>
   <span class="ct">${PERS[p].n} brick</span>
   <span class="nbc${cnt?'':' z'}" title="Bugün nöbetçi">${cnt}</span><button class="eye" title="Haritada göster/gizle">👁</button>`;
  hd.onclick=()=>{openP.has(p)?openP.delete(p):openP.add(p);render();};
  hd.querySelector('.eye').onclick=e=>{e.stopPropagation();hidden.has(p)?hidden.delete(p):hidden.add(p);geo.setStyle(styleOf);updBadges();render();};
  pl.appendChild(hd);
  if(!(q||openP.has(p)))continue;
  const body=document.createElement('div');body.className='pb';
  if(!rows.length){body.innerHTML='<div class="none">Bugün bu kişinin bricklerinde nöbetçi eczane yok.</div>';}
  rows.forEach(({b,l})=>{
   const t=document.createElement('div');t.className='bt';t.textContent=short(b);
   const oth=OWN[b].filter(o=>o!==p);
   if(oth.length){const i=document.createElement('i');i.textContent=' • ortak: '+oth.map(o=>o.split(' ')[0]).join(', ');t.appendChild(i);}
   t.onclick=()=>focusBrick(b);body.appendChild(t);
   l.forEach(x=>{const it=document.createElement('div');it.className='nbitem';
    const nm=document.createElement('b');nm.textContent=cln(x.name);it.appendChild(nm);
    if(x.address){const s=document.createElement('small');s.textContent=cln(x.address);it.appendChild(s);}
    if(x.phone){const s=document.createElement('small'),a=document.createElement('a');a.href='tel:'+tel(x.phone);a.textContent='📞 '+nbPhone(x.phone);a.onclick=e=>e.stopPropagation();s.appendChild(a);it.appendChild(s);}
    if(x.note){const s=document.createElement('small');s.style.color='#fbbf24';s.textContent='ℹ️ '+cln(x.note);it.appendChild(s);}
    if(mapUrl(x)){const s=document.createElement('small'),a=document.createElement('a');a.href=mapUrl(x);a.target='_blank';a.rel='noopener';a.textContent='📍 Yol tarifi';a.onclick=e=>e.stopPropagation();s.appendChild(a);it.appendChild(s);}
    it.onclick=()=>focusBrick(b);body.appendChild(it);});});
  pl.appendChild(body);}
 if(q&&!pl.children.length)pl.innerHTML='<div class="none" style="padding:8px">Bu isimde nöbetçi eczane yok.</div>';}
document.getElementById('q').oninput=e=>{Q=e.target.value;render();};
lgx.onclick=e=>{e.stopPropagation();setMin(!lg.classList.contains('min'));};
document.getElementById('lgh').onclick=()=>{if(isM())setMin(!lg.classList.contains('min'));};
render();

function mkCtl(pos,defs){const C=L.Control.extend({onAdd(){
 const d=L.DomUtil.create('div','mctl');
 L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
 defs.forEach(([label,on,fn])=>{const btn=L.DomUtil.create('button','',d);
  btn.innerHTML=label; if(on)btn.classList.add('on');
  btn.onclick=()=>fn(btn);});
 return d;}});
 return new C({position:pos}).addTo(map);}
mkCtl('topright',[['Uydu',true,b=>setBase('sat',b)],['Hibrit',false,b=>setBase('hyb',b)],['Sokak',false,b=>setBase('osm',b)]]);
const baseBtns=document.querySelectorAll('.mctl')[0].querySelectorAll('button');
function setBase(m,btn){[sat,ref,osm].forEach(l=>map.removeLayer(l));
 if(m==='sat')sat.addTo(map); if(m==='hyb'){sat.addTo(map);ref.addTo(map);} if(m==='osm')osm.addTo(map);
 setTimeout(ensureDefs,200);
 baseBtns.forEach(x=>x.classList.remove('on'));btn.classList.add('on');}
mkCtl('topright',[['Etiket',true,b=>{b.classList.toggle('on');map.hasLayer(labG)?map.removeLayer(labG):map.addLayer(labG);}],
 ['🔴 Nöbetçi',true,b=>{b.classList.toggle('on');map.hasLayer(nbG)?map.removeLayer(nbG):map.addLayer(nbG);}]]);
</script></body></html>
