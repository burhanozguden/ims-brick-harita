<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ankara IMS Brick Haritası — HD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--panel:rgba(15,22,36,.92);--panel2:#111a2c;--line:rgba(148,163,184,.14);
 --tx:#e2e8f0;--tx2:#94a3b8;--acc:#38bdf8;--acc2:#818cf8;--teal:#2dd4bf;--red:#ef4444;
 --tr:all .22s cubic-bezier(.4,0,.2,1);
 --lfs:9px;--lvis:visible;--lvisb:visible;--es:1;--hs:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;height:100%}
#side{width:288px;min-width:246px;display:flex;flex-direction:column;background:var(--panel);
 backdrop-filter:blur(16px);border-right:1px solid var(--line);z-index:1200;box-shadow:6px 0 26px rgba(0,0,0,.45)}
#hd{padding:13px 14px 8px}
#hd h1{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.02em;
 background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#hd p{margin:3px 0 0;font-size:10px;color:var(--tx2);line-height:1.4}
#stats{display:flex;gap:5px;padding:0 14px 8px}
.st{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 4px;text-align:center}
.st b{display:block;font-size:12px;font-weight:700}
.st span{font-size:8.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
#tabs{display:flex;gap:5px;padding:0 14px 8px}
.tab{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:transparent;
 color:var(--tx2);font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.tab.on{background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(129,140,248,.18));color:#fff;border-color:rgba(56,189,248,.5)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.flt{padding:0 14px 7px;display:flex;flex-direction:column;gap:6px}
.flt input,.flt select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);
 background:var(--panel2);color:var(--tx);font:500 11px 'Inter';outline:none;transition:var(--tr)}
.flt input:focus,.flt select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
.flt ::placeholder{color:#64748b}
#lst,#dlst{flex:1;overflow-y:auto;padding:2px 8px 8px}
#lst::-webkit-scrollbar,#dlst::-webkit-scrollbar,#dt-body::-webkit-scrollbar{width:7px}
#lst::-webkit-scrollbar-thumb,#dlst::-webkit-scrollbar-thumb,#dt-body::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
.row{display:flex;align-items:center;gap:7px;padding:6px 7px;margin:1px 3px;border-radius:8px;cursor:pointer;transition:var(--tr);font-size:11px}
.row:hover{background:rgba(56,189,248,.08)}
.row.sel{background:rgba(56,189,248,.16);outline:1px solid rgba(56,189,248,.4)}
.sw{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.row .nm{flex:1;font-weight:600;line-height:1.25}
.row .ct{font-size:9px;color:var(--tx2);display:flex;gap:6px;flex:none}
.row .ct b{color:var(--acc)}
.drow{padding:6px 8px;margin:1px 3px;border-radius:8px;font-size:10.5px;transition:var(--tr);cursor:pointer}
.drow:hover{background:rgba(45,212,191,.08)}
.drow .dn{font-weight:700}
.drow .dm{font-size:9px;color:var(--tx2);margin-top:1px;line-height:1.35}
.drow .dm i{color:var(--teal);font-style:normal;font-weight:600}
#more{margin:5px 12px 10px;padding:7px;border-radius:8px;border:1px dashed var(--line);
 background:transparent;color:var(--tx2);font:600 10.5px 'Inter';cursor:pointer;transition:var(--tr)}
#more:hover{color:var(--acc);border-color:var(--acc)}
#dt{max-height:44%;display:none;flex-direction:column;border-top:1px solid var(--line);background:var(--panel2)}
#dt.on{display:flex}
#dt-hd{padding:9px 12px 6px;display:flex;align-items:flex-start;gap:8px}
#dt-hd .dot{width:12px;height:12px;border-radius:4px;margin-top:2px;flex:none}
#dt-hd h2{margin:0;font-size:12px;font-weight:800;flex:1}
#dt-hd small{display:block;font-weight:500;font-size:9px;color:var(--tx2);margin-top:2px}
#dt-x{background:none;border:none;color:var(--tx2);font-size:14px;cursor:pointer;transition:var(--tr)}
#dt-x:hover{color:#fff;transform:rotate(90deg)}
#dt-tabs{display:flex;gap:5px;padding:0 12px 6px}
.dtt{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--tx2);font:600 10px 'Inter';cursor:pointer;transition:var(--tr)}
.dtt.on{background:rgba(56,189,248,.16);color:#fff;border-color:rgba(56,189,248,.5)}
#dt-body{flex:1;overflow-y:auto;padding:2px 12px 10px;font-size:10.5px}
#dt-body ol{margin:3px 0;padding-left:18px}
#dt-body li{padding:1.5px 0;border-bottom:1px dotted rgba(148,163,184,.12)}
#dt-body h4{margin:8px 0 3px;font-size:10px;color:var(--teal)}
#map{flex:1;background:#0b1120}
/* —— PARLAK MAVİ BRİCK ETİKETLERİ: koyu kontur + neon ışıma —— */
.blab4{color:#b6ecff;font-weight:800;font-size:var(--lfs);font-family:'Inter';white-space:nowrap;letter-spacing:.03em;
 visibility:var(--lvis);
 text-shadow:-1px -1px 0 #04101f,1px -1px 0 #04101f,-1px 1px 0 #04101f,1px 1px 0 #04101f,
  0 0 10px rgba(56,189,248,.95),0 0 4px rgba(125,211,252,.95);
 transition:font-size .2s}
.blab4.big{visibility:var(--lvisb)}
.eicon4{width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;border:1.5px solid #fff;
 font:800 8.5px/11px 'Inter';text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.7);
 transform:scale(var(--es));transition:transform .2s}
.eicon4:hover{transform:scale(calc(var(--es)*1.35))}
.hicon4{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#0d9488,#2dd4bf);
 border:1.5px solid #fff;font:9.5px/13px sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.7);
 transform:scale(var(--hs));transition:transform .2s}
.hicon4:hover{transform:scale(calc(var(--hs)*1.3))}
.hicon4.ap{filter:saturate(.5);border-style:dashed}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--tx);border-radius:11px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:var(--panel2)}
.leaflet-popup-content{font:500 11px 'Inter';margin:10px 12px}
.pp b{font-weight:800}
.pp .tag{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:999px;background:rgba(56,189,248,.15);color:var(--acc);font-size:9.5px;font-weight:700}
.pp button{margin-top:7px;padding:5px 9px;border-radius:7px;border:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f;font:700 10px 'Inter';cursor:pointer}
/* —— HARİTA İÇİ KONTROLLER (Leaflet control) —— */
.mctl{display:flex;background:var(--panel)!important;backdrop-filter:blur(14px);border:1px solid var(--line)!important;
 border-radius:999px!important;padding:3px;gap:3px;box-shadow:0 6px 24px rgba(0,0,0,.4)!important}
.mctl button{border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--tx2);
 font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.mctl button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f}
.leaflet-control-scale-line{background:rgba(15,22,36,.8);color:#e2e8f0;border-color:rgba(226,232,240,.5);font:600 9px 'Inter'}
@media(max-width:820px){#side{width:56%;min-width:220px}}
</style></head><body>
<div id="app">
<aside id="side">
 <div id="hd"><h1>ANKARA IMS BRICK — HD</h1>
  <p>Saydamsız yüksek çözünürlük • her brick farklı renk sınır çizgisi • 2.419 eczane • 4.425 doktor</p></div>
 <div id="stats">
  <div class="st"><b id="s1">—</b><span>Brick</span></div>
  <div class="st"><b id="s2">—</b><span>Eczane</span></div>
  <div class="st"><b id="s3">—</b><span>Doktor</span></div>
  <div class="st"><b id="s4">—</b><span>Kurum</span></div>

 <div id="tabs">
  <button class="tab on" data-p="p-br">Brick'ler</button>
  <button class="tab" data-p="p-dr">Doktorlar</button>
 </div>
 <div class="pane on" id="p-br">
  <div class="flt">
   <input id="q-br" placeholder="Brick veya eczane ara…"/>
   <select id="f-grp"><option value="">Tüm bölge grupları</option></select>
  </div>
  <div id="lst"></div>
 </div>
 <div class="pane" id="p-dr">
  <div class="flt">
   <input id="q-dr" placeholder="Doktor adı ara…"/>
   <select id="f-brans"><option value="">Tüm branşlar</option></select>
   <select id="f-hosp"><option value="">Tüm kurumlar</option></select>
   <select id="f-brick"><option value="">Tüm brick'ler</option></select>
  </div>
  <div id="dlst"></div>
  <button id="more">Daha fazla göster</button>
 </div>
 <div id="dt">
  <div id="dt-hd"><span class="dot" id="dt-dot"></span>
   <h2 id="dt-t">—<small id="dt-m"></small></h2>
   <button id="dt-x">✕</button></div>
  <div id="dt-tabs">
   <button class="dtt on" data-t="e">Eczaneler <span id="dt-ce"></span></button>
   <button class="dtt" data-t="d">Doktorlar <span id="dt-cd"></span></button>
  </div>
  <div id="dt-body"></div>
 </div>
</aside>
<div id="map"></div>
</div>

function restyle(){casing.setStyle({weight:wCase()});
 geo.eachLayer(l=>l.setStyle({weight:SEL===l.feature.properties.full?wLine()+2.6:wLine()}));}

// —— KATMAN GRUPLARI: etiket / E / 🩺 (aç-kapa = ekle/çıkar) ——
const labG=L.layerGroup(), eG=L.layerGroup(), hG=L.layerGroup();
for(const b of ALLB){ if(!CENT[b])continue;
 const big=META[b].dist===1;
 const m=L.marker([CENT[b][1],CENT[b][0]],{interactive:true,
  icon:L.divIcon({className:'blab4'+(big?' big':''),html:b.replace('ANKARA ','').replace('ANK ',''),iconSize:null})});
 m.on('click',()=>pick(b,false)); labG.addLayer(m);}
for(const b of ALLB){ if(!CENT[b]||!PH[b])continue;
 const m=L.marker([CENT[b][1]-0.0028,CENT[b][0]],{icon:L.divIcon({className:'eicon4',html:'E',iconSize:[14,14]})});
 m.bindPopup(`<div class="pp"><b>${b}</b><br/>${PH[b].length} eczane<span class="tag">${META[b].g}</span><br/><button onclick="window.__pb('${b}')">Eczane listesini aç</button></div>`);
 eG.addLayer(m);}
HOSP.forEach(h=>{ if(h.lat==null)return;
 const m=L.marker([h.lat,h.lon],{icon:L.divIcon({className:'hicon4'+(h.ap?' ap':''),html:'🩺',iconSize:[16,16]})});
 m.bindPopup(`<div class="pp"><b>${h.n}</b><br/>${h.dr} doktor kaydı${h.ap?' • <i>yaklaşık konum</i>':''}<span class="tag">${h.b}</span><br/><button onclick="window.__ph(${h.i})">Doktorlarını listele</button></div>`);
 hG.addLayer(m);});
labG.addTo(map); eG.addTo(map); hG.addTo(map);
window.__pb=b=>pick(b,true);
window.__ph=i=>{document.querySelector('[data-p="p-dr"]').click();
 document.getElementById('f-hosp').value=String(i);drFilter(true);};

// —— HARİTA İÇİ KONTROLLER: altlık + katman aç/kapa ——
function mkCtl(pos,defs){const C=L.Control.extend({onAdd(){
 const d=L.DomUtil.create('div','mctl');
 L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
 defs.forEach(([label,on,fn])=>{const btn=L.DomUtil.create('button','',d);
  btn.innerHTML=label; if(on)btn.classList.add('on');
  btn.onclick=()=>fn(btn);});
 return d;}});
 return new C({position:pos}).addTo(map);}
let baseBtns=[];
mkCtl('topright',[
 ['Uydu',true,b=>setBase('sat',b)],['Hibrit',false,b=>setBase('hyb',b)],['Sokak',false,b=>setBase('osm',b)]]);
baseBtns=document.querySelectorAll('.mctl')[0].querySelectorAll('button');
function setBase(m,btn){[sat,ref,osm].forEach(l=>map.removeLayer(l));
 if(m==='sat')sat.addTo(map); if(m==='hyb'){sat.addTo(map);ref.addTo(map);} if(m==='osm')osm.addTo(map);
 baseBtns.forEach(x=>x.classList.remove('on'));btn.classList.add('on');}
mkCtl('topright',[
 ['Etiket',true,b=>{b.classList.toggle('on');map.hasLayer(labG)?map.removeLayer(labG):map.addLayer(labG);}],
 ['<span style="color:#f87171;font-weight:800">E</span> Eczane',true,b=>{b.classList.toggle('on');map.hasLayer(eG)?map.removeLayer(eG):map.addLayer(eG);}],
 ['🩺 Hastane',true,b=>{b.classList.toggle('on');map.hasLayer(hG)?map.removeLayer(hG):map.addLayer(hG);}]]);

// —— ZOOM'A DUYARLI BOYUTLAR (CSS değişkenleriyle) ——
function scale(){const z=map.getZoom();
 R.setProperty('--lfs',(z<9.5?7:z<11?7.8:z<12.5?9.2:z<14?11:13)+'px');
 R.setProperty('--lvis',z<10.2?'hidden':'visible');
 R.setProperty('--lvisb','visible');
 R.setProperty('--es',z<9.3?0:z<10?.6:z<12?.85:1.15);
 R.setProperty('--hs',z<10?0:z<12?.85:1.2);
 restyle();}
map.on('zoomend',scale);

// —— PANELLER ——
const grpSel=document.getElementById('f-grp');
[...new Set(ALLB.map(b=>META[b].g))].sort().forEach(g=>grpSel.add(new Option(g,g)));
const lst=document.getElementById('lst');
function drawBr(){
 const q=(document.getElementById('q-br').value||'').toLocaleUpperCase('tr');
 const g=grpSel.value; lst.innerHTML='';
 ALLB.forEach(b=>{ if(g&&META[b].g!==g)return;
  let hit=!q||b.toLocaleUpperCase('tr').includes(q),sub='';
  if(!hit&&q.length>=3){const f=(PH[b]||[]).find(p=>p.toLocaleUpperCase('tr').includes(q));if(f){hit=true;sub=f}}
  if(!hit)return;
  const d=document.createElement('div');d.className='row'+(SEL===b?' sel':'');
  d.innerHTML=`<span class="sw" style="background:${LC[b]}"></span><span class="nm">${b}${sub?`<div style="font-weight:500;font-size:9px;color:var(--acc)">→ ${sub}</div>`:''}</span><span class="ct"><span><b>${META[b].e}</b>e</span><span><b>${META[b].d}</b>d</span></span>`;
  d.onclick=()=>pick(b,true); lst.appendChild(d);});
}
document.getElementById('q-br').oninput=drawBr; grpSel.onchange=drawBr;
const fB=document.getElementById('f-brans'),fH=document.getElementById('f-hosp'),fK=document.getElementById('f-brick');
BRANS.forEach((b,i)=>fB.add(new Option(b,i)));
HOSP.forEach(h=>fH.add(new Option(h.n.length>44?h.n.slice(0,44)+'…':h.n,h.i)));
ALLB.forEach(b=>fK.add(new Option(b,b)));
const dlst=document.getElementById('dlst'),more=document.getElementById('more');
let LIM=120;
function drFilter(reset){ if(reset)LIM=120;
 const q=(document.getElementById('q-dr').value||'').toLocaleUpperCase('tr');
 const vb=fB.value,vh=fH.value,vk=fK.value; let out=[],n=0;
 for(const[bIdx,hIdx,name]of DOCS){
  if(vb&&bIdx!=vb)continue; if(vh&&hIdx!=vh)continue;
  if(vk&&HOSP[hIdx].b!==vk)continue;
  if(q&&!name.toLocaleUpperCase('tr').includes(q))continue;
  n++; if(out.length<LIM)out.push([bIdx,hIdx,name]);}
 dlst.innerHTML='';
 out.forEach(([bI,hI,nm])=>{const d=document.createElement('div');d.className='drow';
  d.innerHTML=`<div class="dn">${nm}</div><div class="dm"><i>${BRANS[bI]}</i> • ${HOSP[hI].n}<br/>Brick: ${HOSP[hI].b}</div>`;
  d.onclick=()=>{const h=HOSP[hI];if(h.lat!=null)map.flyTo([h.lat,h.lon],14.5,{duration:.8});pick(h.b,false);};
  dlst.appendChild(d);});
 more.style.display=n>LIM?'block':'none';
 more.textContent=`Daha fazla göster (${(n-LIM).toLocaleString('tr')} kayıt)`;}
document.getElementById('q-dr').oninput=()=>drFilter(true);
[fB,fH,fK].forEach(s=>s.onchange=()=>drFilter(true));
more.onclick=()=>{LIM+=200;drFilter(false)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));
 document.getElementById(t.dataset.p).classList.add('on');});
const dt=document.getElementById('dt');let dtTab='e',dtB=null;
document.getElementById('dt-x').onclick=()=>{dt.classList.remove('on');SEL=null;restyle();drawBr();};
document.querySelectorAll('.dtt').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.dtt').forEach(x=>x.classList.remove('on'));t.classList.add('on');
 dtTab=t.dataset.t;dtBody();});
function pick(b,zoom){SEL=b;restyle();
 if(LY[b]&&zoom){let bd=null;LY[b].forEach(l=>{bd=bd?bd.extend(l.getBounds()):L.latLngBounds(l.getBounds().getSouthWest(),l.getBounds().getNorthEast())});
  map.flyToBounds(bd.pad(.22),{duration:.8});}
 dtB=b;
 document.getElementById('dt-dot').style.background=LC[b];
 document.getElementById('dt-t').childNodes[0].textContent=b;
 document.getElementById('dt-m').textContent=`${META[b].g} • ${META[b].e} eczane • ${META[b].d} doktor`;
 document.getElementById('dt-ce').textContent=`(${META[b].e})`;
 document.getElementById('dt-cd').textContent=`(${META[b].d})`;
 dt.classList.add('on');dtBody();drawBr();}
function dtBody(){const el=document.getElementById('dt-body');el.innerHTML='';const b=dtB;if(!b)return;
 if(dtTab==='e'){const ol=document.createElement('ol');(PH[b]||[]).forEach(p=>{const li=document.createElement('li');li.textContent=p;ol.appendChild(li)});el.appendChild(ol);}
 else{const byH={};DOCS.forEach(([bI,hI,nm])=>{if(HOSP[hI].b===b)(byH[hI]=byH[hI]||[]).push([bI,nm])});
  const ks=Object.keys(byH);
  if(!ks.length){el.innerHTML='<p style="color:var(--tx2)">Bu brick için doktor kaydı yok.</p>';return;}
  ks.sort((a,c)=>byH[c].length-byH[a].length).forEach(hI=>{
   const h4=document.createElement('h4');h4.textContent=`${HOSP[hI].n} (${byH[hI].length})`;el.appendChild(h4);
   const ol=document.createElement('ol');byH[hI].forEach(([bI,nm])=>{const li=document.createElement('li');li.textContent=`${nm} — ${BRANS[bI]}`;ol.appendChild(li)});
   el.appendChild(ol);});}}
drawBr();drFilter(true);scale();
</script></body></html>
