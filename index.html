.stripe{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;
 background:repeating-linear-gradient(45deg,#f59e0b 0 3px,#10b981 3px 6px)}
.stripe2{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;

.blab4{color:#eaf7ff;font-weight:800;font-size:var(--lfs);font-family:'Inter';white-space:nowrap;letter-spacing:.02em;

.blab4.big{visibility:visible}
.leaflet-popup-content-wrapper{background:#111a2c;color:var(--tx);border-radius:11px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:#111a2c}
.leaflet-popup-content{font:500 11px 'Inter';margin:10px 12px}
.pp b{font-weight:800}
.pp .own{display:inline-block;margin:4px 4px 0 0;padding:2px 8px;border-radius:999px;font-size:9.5px;font-weight:800;color:#0b1120}
.pp table{margin-top:6px;font-size:10px;border-collapse:collapse}
.pp td{padding:1px 8px 1px 0;color:var(--tx2)}
.pp td b{color:var(--tx)}
.mctl{display:flex;background:var(--panel)!important;backdrop-filter:blur(14px);border:1px solid var(--line)!important;
 border-radius:999px!important;padding:3px;gap:3px;box-shadow:0 6px 24px rgba(0,0,0,.4)!important}
.mctl button{border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--tx2);
 font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.mctl button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f}
.leaflet-control-scale-line{background:rgba(15,22,36,.8);color:#e2e8f0;border-color:rgba(226,232,240,.5);font:600 9px 'Inter'}

function ensureDefs(){
 let s=document.querySelector('#map svg'); if(!s)return;
 if(s.querySelector('#patBM'))return;
 const NS='http://www.w3.org/2000/svg';
 const defs=document.createElementNS(NS,'defs');
 function pat(id,c1,c2){const p=document.createElementNS(NS,'pattern');
  p.setAttribute('id',id);p.setAttribute('width','10');p.setAttribute('height','10');
  p.setAttribute('patternUnits','userSpaceOnUse');p.setAttribute('patternTransform','rotate(45)');
  const r1=document.createElementNS(NS,'rect');r1.setAttribute('width','10');r1.setAttribute('height','10');r1.setAttribute('fill',c1);
  const r2=document.createElementNS(NS,'rect');r2.setAttribute('width','5');r2.setAttribute('height','10');r2.setAttribute('fill',c2);
  p.appendChild(r1);p.appendChild(r2);defs.appendChild(p);}
 pat('patBM',PERS['BURHAN ÖZGÜDEN'].c,PERS['MUHARREM FURKAN ÇETİN'].c);
 pat('patBS',PERS['BURHAN ÖZGÜDEN'].c,PERS['SÜMEYYE SANCAK'].c);
 s.insertBefore(defs,s.firstChild);}
const PATTERN={'ANK ORMANCIFTLIGI':'url(#patBM)','ANK ORTADOGU':'url(#patBS)'};

const hidden=new Set(); const LAYERS=[];
function styleOf(f){
 const b=f.properties.full, owners=OWN[b]||[];
 const anyVisible=owners.some(o=>!hidden.has(o));
 const fillC=PATTERN[b]||PERS[owners[0]]?.c||'#333';
 return {color:'#ffffff',weight:1.6,fillColor:fillC,
  fillOpacity:anyVisible?(PATTERN[b]?.42:.40):.04,opacity:anyVisible?.95:.25};}

const geo=L.geoJSON(GJ,{style:styleOf,onEachFeature:(f,l)=>{LAYERS.push(l);

 l.bindPopup(`<div class="pp"><b>${b}</b><br/>${chips}
  <table><tr><td>Eczane</td><td><b>${m.ecz??'-'}</b></td></tr></table></div>`);
 l.on('mouseover',()=>l.setStyle({weight:3}));
 l.on('mouseout',()=>l.setStyle({weight:1.6}));
}}).addTo(map);

function renderPharmacies() {
    pharmacyMarkers.clearLayers();
    for (const brickName in PH) {
        const eczList = PH[brickName];
        if (!eczList || eczList.length === 0) continue;
        const coords = CENT[brickName] || CENT["ANK " + brickName];
        if (coords) {
            eczList.forEach(ecz => {
                const marker = L.marker([coords[1], coords[0]], {
                    icon: L.divIcon({
                        className: 'pharmacy-icon',
                        html: `<div style="background:#ef4444;color:white;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:bold;box-shadow:0 2px 5px rgba(0,0,0,0.5);white-space:nowrap;">🏥 ${ecz.name || ecz}</div>`,
                        iconSize: null
                    })
                });
                marker.bindPopup(`<div class="pp"><b>${ecz.name || ecz}</b><br><small>${ecz.address || brickName}</small><br>Telefon: ${ecz.phone || '-'}</div>`);
                pharmacyMarkers.addLayer(marker);
            });
        }
    }
}

 d.innerHTML=`<span class="chip" style="background:${PERS[p].c}"></span>
  <span class="nm">${p}</span>
  <span class="ct">${PERS[p].n} brick • ${PERS[p].e.toLocaleString('tr')} ecz</span>`;
 d.onclick=()=>{if(hidden.has(p))hidden.delete(p);else hidden.add(p);
  d.classList.toggle('off');geo.setStyle(styleOf);};
 pl.appendChild(d);}

function mkCtl(pos,defs){const C=L.Control.extend({onAdd(){
 const d=L.DomUtil.create('div','mctl');
 L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
 defs.forEach(([label,on,fn])=>{const btn=L.DomUtil.create('button','',d);
  btn.innerHTML=label; if(on)btn.classList.add('on');
  btn.onclick=()=>fn(btn);});
 return d;}});
 return new C({position:pos}).addTo(map);}

mkCtl('topright',[['Uydu',true,b=>setBase('sat',b)],['Hibrit',false,b=>setBase('hyb',b)],['Sokak',false,b=>setBase('osm',b)]]);
const baseBtns=document.querySelectorAll('.mctl')[0].querySelectorAll('button');
function setBase(m,btn){[sat,ref,osm].forEach(l=>map.removeLayer(l));
 if(m==='sat')sat.addTo(map); if(m==='hyb'){sat.addTo(map);ref.addTo(map);} if(m==='osm')osm.addTo(map);
 setTimeout(ensureDefs,200);
 baseBtns.forEach(x=>x.classList.remove('on'));btn.classList.add('on');}
mkCtl('topright',[['Etiket',true,b=>{b.classList.toggle('on');map.hasLayer(labG)?map.removeLayer(labG):map.addLayer(labG);}]]);
