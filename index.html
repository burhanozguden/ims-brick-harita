<title>Ankara IMS Brick Haritası — HD</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1120;--panel:rgba(15,22,36,.92);--panel2:#111a2c;--line:rgba(148,163,184,.14);
 --tx:#e2e8f0;--tx2:#94a3b8;--acc:#38bdf8;--acc2:#818cf8;--teal:#2dd4bf;--red:#ef4444;
 --tr:all .22s cubic-bezier(.4,0,.2,1);
 --lfs:9px;--lvis:visible;--lvisb:visible;--es:1;--hs:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;height:100%}
#side{width:288px;min-width:246px;display:flex;flex-direction:column;background:var(--panel);
 backdrop-filter:blur(16px);border-right:1px solid var(--line);z-index:1200;box-shadow:6px 0 26px rgba(0,0,0,.45)}
#hd{padding:13px 14px 8px}
#hd h1{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.02em;
 background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
#hd p{margin:3px 0 0;font-size:10px;color:var(--tx2);line-height:1.4}
#stats{display:flex;gap:5px;padding:0 14px 8px}
.st{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 4px;text-align:center}
.st b{display:block;font-size:12px;font-weight:700}
.st span{font-size:8.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
#tabs{display:flex;gap:5px;padding:0 14px 8px}
.tab{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--line);background:transparent;
 color:var(--tx2);font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.tab.on{background:linear-gradient(135deg,rgba(56,189,248,.18),rgba(129,140,248,.18));color:#fff;border-color:rgba(56,189,248,.5)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
.flt{padding:0 14px 7px;display:flex;flex-direction:column;gap:6px}
.flt input,.flt select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line);
 background:var(--panel2);color:var(--tx);font:500 11px 'Inter';outline:none;transition:var(--tr)}
.flt input:focus,.flt select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.14)}
.flt ::placeholder{color:#64748b}
#lst,#dlst{flex:1;overflow-y:auto;padding:2px 8px 8px}
#lst::-webkit-scrollbar,#dlst::-webkit-scrollbar,#dt-body::-webkit-scrollbar{width:7px}
#lst::-webkit-scrollbar-thumb,#dlst::-webkit-scrollbar-thumb,#dt-body::-webkit-scrollbar-thumb{background:#243044;border-radius:8px}
.row{display:flex;align-items:center;gap:7px;padding:6px 7px;margin:1px 3px;border-radius:8px;cursor:pointer;transition:var(--tr);font-size:11px}
.row:hover{background:rgba(56,189,248,.08)}
.row.sel{background:rgba(56,189,248,.16);outline:1px solid rgba(56,189,248,.4)}
.sw{width:11px;height:11px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.row .nm{flex:1;font-weight:600;line-height:1.25}
.row .ct{font-size:9px;color:var(--tx2);display:flex;gap:6px;flex:none}
.row .ct b{color:var(--acc)}
.drow{padding:6px 8px;margin:1px 3px;border-radius:8px;font-size:10.5px;transition:var(--tr);cursor:pointer}
.drow:hover{background:rgba(45,212,191,.08)}
.drow .dn{font-weight:700}
.drow .dm{font-size:9px;color:var(--tx2);margin-top:1px;line-height:1.35}
.drow .dm i{color:var(--teal);font-style:normal;font-weight:600}
#more{margin:5px 12px 10px;padding:7px;border-radius:8px;border:1px dashed var(--line);
 background:transparent;color:var(--tx2);font:600 10.5px 'Inter';cursor:pointer;transition:var(--tr)}
#more:hover{color:var(--acc);border-color:var(--acc)}
#dt{max-height:44%;display:none;flex-direction:column;border-top:1px solid var(--line);background:var(--panel2)}
#dt.on{display:flex}
#dt-hd{padding:9px 12px 6px;display:flex;align-items:flex-start;gap:8px}
#dt-hd .dot{width:12px;height:12px;border-radius:4px;margin-top:2px;flex:none}
#dt-hd h2{margin:0;font-size:12px;font-weight:800;flex:1}
#dt-hd small{display:block;font-weight:500;font-size:9px;color:var(--tx2);margin-top:2px}
#dt-x{background:none;border:none;color:var(--tx2);font-size:14px;cursor:pointer;transition:var(--tr)}
#dt-x:hover{color:#fff;transform:rotate(90deg)}
#dt-tabs{display:flex;gap:5px;padding:0 12px 6px}
.dtt{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--tx2);font:600 10px 'Inter';cursor:pointer;transition:var(--tr)}
.dtt.on{background:rgba(56,189,248,.16);color:#fff;border-color:rgba(56,189,248,.5)}
#dt-body{flex:1;overflow-y:auto;padding:2px 12px 10px;font-size:10.5px}
#dt-body ol{margin:3px 0;padding-left:18px}
#dt-body li{padding:1.5px 0;border-bottom:1px dotted rgba(148,163,184,.12)}
#dt-body h4{margin:8px 0 3px;font-size:10px;color:var(--teal)}
#map{flex:1;background:#0b1120}
/* —— PARLAK MAVİ BRİCK ETİKETLERİ: koyu kontur + neon ışıma —— */
.blab4{color:#b6ecff;font-weight:800;font-size:var(--lfs);font-family:'Inter';white-space:nowrap;letter-spacing:.03em;
 visibility:var(--lvis);
 text-shadow:-1px -1px 0 #04101f,1px -1px 0 #04101f,-1px 1px 0 #04101f,1px 1px 0 #04101f,
  0 0 10px rgba(56,189,248,.95),0 0 4px rgba(125,211,252,.95);
 transition:font-size .2s}
.blab4.big{visibility:var(--lvisb)}
.eicon4{width:14px;height:14px;border-radius:50%;background:var(--red);color:#fff;border:1.5px solid #fff;
 font:800 8.5px/11px 'Inter';text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.7);
 transform:scale(var(--es));transition:transform .2s}
.eicon4:hover{transform:scale(calc(var(--es)*1.35))}
.hicon4{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#0d9488,#2dd4bf);
 border:1.5px solid #fff;font:9.5px/13px sans-serif;text-align:center;box-shadow:0 1px 5px rgba(0,0,0,.7);
 transform:scale(var(--hs));transition:transform .2s}
.hicon4:hover{transform:scale(calc(var(--hs)*1.3))}
.hicon4.ap{filter:saturate(.5);border-style:dashed}
.leaflet-popup-content-wrapper{background:var(--panel2);color:var(--tx);border-radius:11px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.55)}
.leaflet-popup-tip{background:var(--panel2)}
.leaflet-popup-content{font:500 11px 'Inter';margin:10px 12px}
.pp b{font-weight:800}
.pp .tag{display:inline-block;margin-top:4px;padding:2px 7px;border-radius:999px;background:rgba(56,189,248,.15);color:var(--acc);font-size:9.5px;font-weight:700}
.pp button{margin-top:7px;padding:5px 9px;border-radius:7px;border:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f;font:700 10px 'Inter';cursor:pointer}
/* —— HARİTA İÇİ KONTROLLER (Leaflet control) —— */
.mctl{display:flex;background:var(--panel)!important;backdrop-filter:blur(14px);border:1px solid var(--line)!important;
 border-radius:999px!important;padding:3px;gap:3px;box-shadow:0 6px 24px rgba(0,0,0,.4)!important}
.mctl button{border:none;border-radius:999px;padding:6px 12px;background:transparent;color:var(--tx2);
 font:600 11px 'Inter';cursor:pointer;transition:var(--tr)}
.mctl button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121f}
.leaflet-control-scale-line{background:rgba(15,22,36,.8);color:#e2e8f0;border-color:rgba(226,232,240,.5);font:600 9px 'Inter'}
@media(max-width:820px){#side{width:56%;min-width:220px}}
/* —— NÖBETÇİ ECZANE (NB_UI_PATCHED) —— */
.nb-info{margin:7px 0 0;padding:6px 9px;border-radius:9px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.38);color:#fecaca;font-size:9.5px;line-height:1.4}
.nb-info b{color:#fff}
.nb-info.old{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.4);color:#fde68a}
.nbchk{display:flex;align-items:center;gap:7px;padding:1px 2px;font-size:10.5px;font-weight:600;color:var(--tx2);cursor:pointer;user-select:none}
.nbchk input{width:auto!important;margin:0;accent-color:#ef4444}
.row .nbc{flex:none;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:#ef4444;color:#fff;font:800 9px/17px 'Inter';text-align:center;box-shadow:0 0 0 2px rgba(239,68,68,.25)}
.eicon4.nb{background:#fbbf24;color:#2a1a00;border-color:#fff;animation:nbp 1.7s infinite}
@keyframes nbp{0%{box-shadow:0 0 0 0 rgba(251,191,36,.75),0 1px 5px rgba(0,0,0,.7)}70%{box-shadow:0 0 0 10px rgba(251,191,36,0),0 1px 5px rgba(0,0,0,.7)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0),0 1px 5px rgba(0,0,0,.7)}}
#dt-body .nbbox{margin:2px 0 9px;padding:7px 9px 5px;border-radius:9px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.42)}
#dt-body .nbbox h4{margin:0 0 4px;color:#fca5a5}
.nbitem{padding:5px 0;border-top:1px dashed rgba(239,68,68,.28);line-height:1.35}
.nbitem:first-of-type{border-top:0}
.nbitem b{display:block;font-size:11px}
.nbitem small{display:block;color:var(--tx2);font-size:9.5px}
.nbitem a{color:var(--acc);text-decoration:none;font-weight:700}
#dt-body li.nb{background:rgba(239,68,68,.13);border-radius:5px;font-weight:700;border-bottom-color:transparent}
.nbbadge{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#ef4444;color:#fff;font-size:8px;font-weight:800;letter-spacing:.04em;vertical-align:middle}
.pp .nbtag{background:rgba(239,68,68,.18);color:#fca5a5}

 <div id="hd"><h1>ANKARA IMS BRICK — HD</h1>

  <div id="lst"></div>

 <div id="dt">

   <h2 id="dt-t">—<small id="dt-m"></small></h2>
   <button id="dt-x">✕</button></div>
  <div id="dt-body"></div>
 </div>
</aside>
<div id="map"></div>
</div>

const NB=(typeof NOBET!=='undefined'&&NOBET&&NOBET.bricks)?NOBET:{date:'',total:0,matched:0,bricks:{}};

const nbKey=s=>nbNorm(s).split(' ').filter(t=>t&&!NB_STOP.has(t)).join(' ');
const nbList=b=>NB.bricks[b]||[];
const nbIs=(b,name)=>{const k=nbKey(name);return !!k&&nbList(b).some(n=>n.key===k)};
const nbDate=NB.date?NB.date.split('-').reverse().join('.'):'';
const nbTotal=Object.values(NB.bricks).reduce((a,v)=>a+v.length,0);

document.getElementById('q-br').oninput=drawBr; grpSel.onchange=drawBr; document.getElementById('f-nb').onchange=nbApplyFilter;
const dt=document.getElementById('dt');let dtTab='e',dtB=null;
document.getElementById('dt-x').onclick=()=>{dt.classList.remove('on');SEL=null;restyle();drawBr();};
function pick(b,zoom){SEL=b;restyle();
 if(LY[b]&&zoom){let bd=null;LY[b].forEach(l=>{bd=bd?bd.extend(l.getBounds()):L.latLngBounds(l.getBounds().getSouthWest(),l.getBounds().getNorthEast())});
  map.flyToBounds(bd.pad(.22),{duration:.8});}
 dtB=b;
 document.getElementById('dt-dot').style.background=LC[b];
 document.getElementById('dt-t').childNodes[0].textContent=b;
 document.getElementById('dt-m').textContent=`${META[b].g}`+(nbList(b).length?` • 🔴 ${nbList(b).length} nöbetçi`:'');
   dt.classList.add('on');dtBody();drawBr();}
function dtBody(){const el=document.getElementById('dt-body');el.innerHTML='';const b=dtB;if(!b)return;
 if(dtTab==='e'){
  const nl=nbList(b);
  if(nl.length){const bx=document.createElement('div');bx.className='nbbox';
   const h=document.createElement('h4');h.textContent=`🔴 Bugün nöbetçi${nbDate?' ('+nbDate+')':''} — ${nl.length} eczane`;bx.appendChild(h);
   nl.forEach(n=>{const it=document.createElement('div');it.className='nbitem';
    const nm=document.createElement('b');nm.textContent=(n.name||'').replace(/\s+/g,' ').trim();it.appendChild(nm);
    if(n.address){const ad=document.createElement('small');ad.textContent=n.address;it.appendChild(ad);}
    if(n.phone){const ph=document.createElement('small');const a=document.createElement('a');
     a.href='tel:'+String(n.phone).replace(/[^\d+]/g,'');a.textContent='📞 '+nbPhone(n.phone);ph.appendChild(a);it.appendChild(ph);}
    bx.appendChild(it);});
   el.appendChild(bx);}
  else{const p=document.createElement('p');p.style.color='var(--tx2)';p.textContent="Bugün bu brick'te nöbetçi eczane yok.";el.appendChild(p);}}
 }
drawBr();scale();
