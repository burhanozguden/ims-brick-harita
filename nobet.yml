name: Nöbetçi eczaneleri güncelle

on:
  schedule:
    # GitHub cron UTC'dir. 05:30 UTC = 08:30 TR; sonra kaçırılırsa diye tekrar.
    - cron: "30 5 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nobet
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python update_pharmacies.py
      - name: Hata ayıklama çıktısını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
      - name: Değişiklik varsa commit et
        run: |
          git config user.name "nobet-bot"
          git config user.email "nobet-bot@users.noreply.github.com"
          git add index.html unmatched.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Nöbetçi eczaneler: $(TZ=Europe/Istanbul date +%F)"
          git push
